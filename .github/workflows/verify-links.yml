# Weekly live check of every cited source URL. verify_links.py was written
# for exactly this seat (README: it "belongs in a scheduled job") but never
# had one, so the "Sources checked" date every page shows only moved when
# somebody remembered to run it by hand.
#
# On a fully clean pass the script writes verified.json, and this workflow
# commits it (plus any freshly captured citation titles and the rebuilt
# meta.json) so the site's date advances on its own. On any failure nothing
# is committed — the old date stands, which is the honest state — and an
# issue lists the dead URLs and the rows that cite them.
name: Verify sources

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every source URL
        id: verify
        run: |
          set +e
          python3 verify_links.py 2>&1 | tee verify.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit the fresh verification date
        if: steps.verify.outputs.exit == '0'
        run: |
          python3 build_meta.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified.json sources.json meta.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Record a clean source-verification pass"
            git push
          fi

      - name: Open or update the dead-links issue
        if: steps.verify.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled source check found problems"
          body_file=issue-body.md
          {
            echo "The weekly \`verify_links.py\` run failed. Each URL below needs a human:"
            echo "find a real source for the claim — never substitute a search hit"
            echo "(see README, 'Editing the data')."
            echo
            echo '```'
            tail -n 80 verify.log
            echo '```'
            echo
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > "$body_file"
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
                     --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Fail the run when sources failed
        if: steps.verify.outputs.exit != '0'
        run: exit 1
